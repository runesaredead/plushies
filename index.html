<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plushies Gallery</title>
    <style>
        :root {
            --primary-color: #ff5722;
            --background-color: #121212;
            --card-color: #1e1e1e;
            --text-color: #ffffff;
            --secondary-text: #aaaaaa;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        header {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 1.5rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            margin: 0;
            font-size: 2.5rem;
            background: linear-gradient(to right, #ff5722, #ff9800);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }
        
        .description {
            max-width: 800px;
            margin: 1rem auto;
            text-align: center;
            color: var(--secondary-text);
            padding: 0 1rem;
        }
        
        .filter-bar {
            display: flex;
            justify-content: center;
            margin: 1.5rem 0;
            gap: 0.5rem;
            flex-wrap: wrap;
            padding: 0 1rem;
        }
        
        .filter-btn {
            background-color: var(--card-color);
            color: var(--text-color);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background-color: var(--primary-color);
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
        }
        
        .plushie-card {
            background-color: var(--card-color);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .plushie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
        
        .plushie-img {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #ff1500, #ff4800);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .plushie-img img {
            max-width: 100%;
            max-height: 180px;
            display: block;
            image-rendering: pixelated;
        }
        
        .plushie-info {
            padding: 0.75rem;
            text-align: center;
        }
        
        .plushie-id {
            font-weight: 600;
            color: var(--primary-color);
        }
        
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--secondary-text);
            background-color: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Animation for cards */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .plushie-card {
            animation: fadeIn 0.3s ease forwards;
            opacity: 0;
        }
        
        .hidden {
            display: none;
        }
        
        /* Loading spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            margin: 2rem auto;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
                padding: 1rem;
            }
            
            .plushie-img {
                height: 140px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Plushies, Powered by Mariodin</h1>
    </header>
    
    <div class="description">
        <p>An interactive exhibition of 3D voxel art. Click on any piece to explore the full interactive model.</p>
    </div>
    
    <div class="gallery" id="gallery">
        <!-- Gallery items will be populated here via JavaScript -->
        <div class="spinner" id="loading-spinner"></div>
    </div>
    
    <footer>
        <p>© 2023 Mariodin. All rights reserved.</p>
    </footer>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gallery = document.getElementById('gallery');
            const spinner = document.getElementById('loading-spinner');
            
            // Create plushie cards for all sprites
            let delay = 0;
            let loadedCount = 0;
            const totalCount = 182; // Adjust based on actual count
            
            for (let i = 1; i <= totalCount; i++) {
                // Create card with delay for animation
                createPlushieCard(i, delay);
                delay += 20; // Stagger the animations
            }
            
            function createPlushieCard(spriteId, delay) {
                // Format sprite ID with leading zeros
                const formattedId = spriteId.toString().padStart(3, '0');
                
                // Create elements
                const card = document.createElement('div');
                card.className = 'plushie-card';
                card.style.animationDelay = `${delay}ms`;
                
                // Get base URL for GitHub Pages compatibility
                const baseUrl = window.location.pathname.includes('/plushies') 
                    ? '/plushies' 
                    : '';
                
                // Create HTML for card
                card.innerHTML = `
                    <div class="plushie-img">
                        <img src="${baseUrl}/thumbnails/sprite_${formattedId}.png" alt="Plushie ${formattedId}" loading="lazy" onload="this.parentElement.classList.add('loaded')">
                    </div>
                `;
                
                // Add click handler
                card.addEventListener('click', function() {
                    window.location.href = `${baseUrl}/viewer.html?sprite=${spriteId}`;
                });
                
                // Append to gallery
                gallery.appendChild(card);
                
                // Track loading progress
                loadedCount++;
                if (loadedCount >= totalCount) {
                    // Hide spinner when all cards are created
                    spinner.style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
