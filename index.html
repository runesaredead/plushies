<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Plushies Powered by Mariodin</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: white;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 300;
        }
        p {
            color: #ccc;
            margin-bottom: 2rem;
        }
        .highlight {
            color: #ff5722;
            margin: 1rem 0 2rem 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .plushie-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .plushie-card:hover {
            transform: translateY(-5px);
        }
        .plushie-image {
            width: 120px;
            height: 120px;
            border-radius: 4px;
            background-color: #ff5722;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .plushie-image img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .sheet-selector {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            gap: 1rem;
        }
        .sheet-button {
            background-color: #333;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .sheet-button.active {
            background-color: #ff5722;
        }
        .sheet-button:hover {
            background-color: #444;
        }
        .sheet-button.active:hover {
            background-color: #e64a19;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pizza Plushies Powered by Mariodin</h1>
        <p>An interactive exhibition of 3D voxel art. Click on any piece to explore the full interactive model.</p>
        <div class="highlight">The rest of the 1500 ninjas are coming soon! Keep an eye out for yours.</div>
        
        <div class="sheet-selector" id="sheet-selector">
            <button class="sheet-button active" data-sheet="all">All Plushies</button>
            <button class="sheet-button" data-sheet="0">Sheet 1</button>
            <button class="sheet-button" data-sheet="1">Sheet 2</button>
            <button class="sheet-button" data-sheet="2">Sheet 3</button>
            <button class="sheet-button" data-sheet="3">Sheet 4</button>
        </div>
        
        <div class="grid" id="plushies-grid">
            <!-- Plushie cards will be generated here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if we're on GitHub Pages
            const isGitHubPages = window.location.hostname.includes('github.io');
            
            if (isGitHubPages) {
                const notice = document.createElement('div');
                notice.style.background = 'rgba(255, 87, 34, 0.1)';
                notice.style.padding = '10px';
                notice.style.borderRadius = '4px';
                notice.style.marginBottom = '20px';
                notice.style.border = '1px solid #ff5722';
                notice.innerHTML = `
                    <strong>GitHub Pages Notice:</strong> 3D models may not load properly on GitHub Pages due to file size limitations.
                    For the full experience, please clone the repository and run it locally using the Python server.
                `;
                
                const container = document.querySelector('.container');
                container.insertBefore(notice, document.querySelector('.highlight').nextElementSibling);
            }
            
            const grid = document.getElementById('plushies-grid');
            const sheetSelector = document.getElementById('sheet-selector');
            
            // Sheet configurations with correct sprite counts
            const sheets = [
                { id: 0, rows: 6, cols: 6, baseIndex: 0 },     // 36 sprites
                { id: 1, rows: 7, cols: 7, baseIndex: 36 },    // 49 sprites
                { id: 2, rows: 7, cols: 7, baseIndex: 85 },    // 49 sprites
                { id: 3, rows: 7, cols: 7, baseIndex: 134 }    // 49 sprites
            ];
            
            // Calculate total sprites
            const totalSprites = sheets.reduce((sum, sheet) => sum + (sheet.rows * sheet.cols), 0);
            
            let currentSheet = 'all';
            
            // Function to create a plushie card
            function createPlushieCard(index) {
                const card = document.createElement('div');
                card.className = 'plushie-card';
                card.setAttribute('data-sprite-id', index);
                
                // Determine which sheet this sprite belongs to
                let sheetNumber = 0;
                for (let i = sheets.length - 1; i >= 0; i--) {
                    if (index >= sheets[i].baseIndex) {
                        sheetNumber = sheets[i].id;
                        break;
                    }
                }
                card.setAttribute('data-sheet', sheetNumber);
                
                // Create image container
                const imageDiv = document.createElement('div');
                imageDiv.className = 'plushie-image';
                
                // Add sprite image
                const img = document.createElement('img');
                img.src = `thumbnails/sprite_${index.toString().padStart(3, '0')}.png`;
                img.alt = `Plushie ${index}`;
                img.onerror = function() {
                    this.style.display = 'none';
                    imageDiv.innerHTML = `<div style="padding: 10px; color: #aaa;">Sprite ${index} not found</div>`;
                };
                imageDiv.appendChild(img);
                
                card.appendChild(imageDiv);
                
                // Add click handler to open the voxel model viewer
                card.addEventListener('click', function() {
                    const spriteId = this.getAttribute('data-sprite-id');
                    window.open(`viewer.html?sprite=${spriteId}`, '_blank');
                });
                
                return card;
            }
            
            // Function to display plushies based on selected sheet
            function displayPlushies(sheetFilter) {
                grid.innerHTML = '';
                
                if (sheetFilter === 'all') {
                    // Show all sprites
                    for (let i = 0; i < totalSprites; i++) {
                        const card = createPlushieCard(i);
                        grid.appendChild(card);
                    }
                } else {
                    // Show only sprites from selected sheet
                    const selectedSheet = sheets[parseInt(sheetFilter)];
                    const startIndex = selectedSheet.baseIndex;
                    const endIndex = startIndex + (selectedSheet.rows * selectedSheet.cols);
                    
                    for (let i = startIndex; i < endIndex; i++) {
                        const card = createPlushieCard(i);
                        grid.appendChild(card);
                    }
                }
            }
            
            // Initialize with all plushies
            displayPlushies(currentSheet);
            
            // Add sheet selector functionality
            sheetSelector.addEventListener('click', function(e) {
                if (e.target.classList.contains('sheet-button')) {
                    // Update active button
                    document.querySelectorAll('.sheet-button').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    e.target.classList.add('active');
                    
                    // Update displayed plushies
                    currentSheet = e.target.getAttribute('data-sheet');
                    displayPlushies(currentSheet);
                }
            });
        });
    </script>
</body>
</html>
