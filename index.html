<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plushie Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .plushie-card {
            background-color: #fff;
            border-radius: 5px;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            text-align: center;
        }
        .plushie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .plushie-image {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
        .plushie-name {
            margin-top: 10px;
            font-size: 14px;
            color: #333;
        }
        .view-button {
            display: block;
            margin-top: 10px;
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
        }
        .filters {
            margin-bottom: 20px;
            text-align: center;
        }
        .filter-button {
            margin: 5px;
            padding: 8px 15px;
            background-color: #ddd;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .filter-button.active {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Plushie Voxel Models</h1>
        
        <div class="filters">
            <button class="filter-button active" data-sheet="all">All Plushies</button>
            <button class="filter-button" data-sheet="sheet1">Sheet 1</button>
            <button class="filter-button" data-sheet="sheet2">Sheet 2</button>
            <button class="filter-button" data-sheet="sheet3">Sheet 3</button>
            <button class="filter-button" data-sheet="sheet4">Sheet 4</button>
        </div>
        
        <div class="gallery" id="plushie-gallery">
            <!-- Plushie cards will be generated here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gallery = document.getElementById('plushie-gallery');
            const filterButtons = document.querySelectorAll('.filter-button');
            
            // Define sheet configurations
            const sheetConfig = {
                sheet1: { start: 0, end: 35, format: '%03d' },
                sheet2: { start: 36, end: 84, format: '%03d' },
                sheet3: { start: 85, end: 133, format: '%03d' },
                sheet4: { start: 134, end: 182, format: '%03d' }
            };
            
            // Create all plushie cards
            createAllPlushieCards();
            
            // Add event listeners to filter buttons
            filterButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // Update active button
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Filter plushies
                    const sheet = this.getAttribute('data-sheet');
                    filterPlushies(sheet);
                });
            });
            
            function createAllPlushieCards() {
                let allPlushies = [];
                
                // Generate plushies for each sheet
                Object.keys(sheetConfig).forEach(sheet => {
                    const config = sheetConfig[sheet];
                    for (let i = config.start; i <= config.end; i++) {
                        const spriteId = i.toString().padStart(3, '0');
                        allPlushies.push({
                            id: spriteId,
                            sheet: sheet
                        });
                    }
                });
                
                // Create and append card for each plushie
                allPlushies.forEach(plushie => {
                    const card = createPlushieCard(plushie);
                    gallery.appendChild(card);
                });
            }
            
            function createPlushieCard(plushie) {
                const card = document.createElement('div');
                card.className = 'plushie-card';
                card.dataset.sheet = plushie.sheet;
                
                const img = document.createElement('img');
                img.className = 'plushie-image';
                img.src = `preview_sprites/sprite_${plushie.id}.png`;
                img.alt = `Plushie ${plushie.id}`;
                
                const name = document.createElement('div');
                name.className = 'plushie-name';
                name.textContent = `Plushie ${plushie.id}`;
                
                const viewButton = document.createElement('a');
                viewButton.className = 'view-button';
                viewButton.href = `viewer.html?sprite=${plushie.id}`;
                viewButton.textContent = 'View 3D Model';
                viewButton.target = '_blank';
                
                card.appendChild(img);
                card.appendChild(name);
                card.appendChild(viewButton);
                
                return card;
            }
            
            function filterPlushies(sheet) {
                const cards = document.querySelectorAll('.plushie-card');
                
                cards.forEach(card => {
                    if (sheet === 'all' || card.dataset.sheet === sheet) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            }
        });
    </script>
</body>
</html>
